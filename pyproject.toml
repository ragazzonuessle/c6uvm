[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "c6_uvm"
version = "1.0.0"
description = "Six-agent KG-first vision-language system for uveal melanoma metastasis-risk stratification and therapy-set decision support"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Subo Cai" },
    { name = "Wuping Xu" },
    { name = "Min Zhang" },
    { name = "Yabin Li" },
    { name = "Xuedong Xu" },
    { name = "Qi Pu" },
]
keywords = [
    "uveal melanoma",
    "multi-agent",
    "vision-language",
    "pathway knowledge graph",
    "conformal prediction",
    "precision oncology",
]
dependencies = [
    "torch>=2.10",
    "numpy>=1.26",
    "scipy>=1.11",
    "lifelines>=0.29",
    "attrs>=24.1",
    "cattrs>=24.1",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
export = ["onnx>=1.16"]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[project.scripts]
c6 = "c6_uvm.clerk.app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
c6_uvm = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/c6_uvm"]
plugins = []
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["lifelines.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
